<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detalytics complete demo flow</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="flow-board">
    <svg id="connector-layer" aria-label="Screen connections">
      <defs>
        <marker id="arrow-current" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#70757d"/></marker>
        <marker id="arrow-proposed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4d8fff"/></marker>
        <marker id="arrow-revision" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7657c8"/></marker>
        <marker id="arrow-unavailable" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#9b7e52"/></marker>
      </defs>
      <g id="connector-lines"></g>
    </svg>
    <header class="board-header">
      <div>
        <p class="eyebrow">Stakeholder review · Screen map</p>
        <h1 class="board-title">Detalytics complete demo flow</h1>
        <p class="board-subtitle">Current experience and proposed cohort-game changes</p>
      </div>
      <aside class="legend" aria-label="Connector legend">
        <span class="legend-item"><i class="legend-swatch"></i>Current navigation</span>
        <span class="legend-item"><i class="legend-swatch proposed"></i>Proposed navigation</span>
        <span class="legend-item"><i class="legend-swatch revision"></i>Revised screen (replaces current dashboard)</span>
        <span class="legend-item"><i class="legend-swatch return"></i>Return to dashboard</span>
        <span class="legend-item"><i class="legend-swatch unavailable"></i>Unavailable evidence</span>
      </aside>
    </header>
  </main>
  <script src="board-data.js"></script>
  <script>
    const board = window.FLOW_BOARD;
    const laneNames = {
      entry: ["1. Entry and check-in", "Login through suggested starting point"],
      setup: ["2. Mentor setup", "Mentor, voice, tone, and introduction"],
      daily: ["3. Daily use", "Dashboard, activities, learning availability, and reflection"],
      cohort: ["4. Proposed cohort layer", "Revised participant view and aggregate views"],
    };

    function wireframe(frame) {
      if (frame.id === "dashboard-cohort") {
        return `<div class="screen-wireframe">
          <div class="wire-kicker">The Ride · Week 3</div><div class="wire-title">Welcome back, S. Williams.</div>
          <div class="wire-card compact-card"><h4>Active focus · Restoring your baseline</h4><p>Small, repeatable actions for steadier energy.</p></div>
          <div class="wire-card mentor-card"><h4>Mentor message</h4><p>“Notice what today is offering you. One deliberate step is enough.”</p></div>
          <div class="wire-card"><h4>Your cohort this week</h4><div class="wire-meter"><span></span></div><div class="wire-milestone"><span>66% progress</span><span>Weekly target: 65%</span></div><p>Progress is normalized to cohort size.</p></div>
          <button class="wire-action" type="button">Open shared cohort progress →</button>
          <div class="state-variant state-comeback">
            <strong>Comeback credit</strong>
            <span>Your first contribution after seven inactive days receives one private extra credit.</span>
          </div>
          <div class="wire-card activity-card"><h4>Three recommended Path activities</h4>
            <p><strong>Morning light</strong><span>Step outside soon after waking.</span></p>
            <p><strong>Twenty minutes outside</strong><span>Choose a comfortable pace.</span></p>
            <p><strong>Wind-down hour</strong><span>Make the final hour quieter.</span></p>
          </div>
          <div class="metric-grid dashboard-grid">
            <div class="metric"><span class="metric-label">Personal journey</span><strong class="metric-value">8 practices</strong></div>
            <div class="metric"><span class="metric-label">Reflection</span><strong class="metric-value">Add today’s note</strong></div>
          </div>
          <div class="wire-card unavailable-card"><h4>Constellation unavailable</h4><p>No learning data is configured for this current destination. The proposed learning contribution requires enabling v2 Constellation learning data.</p></div>
          <div class="wire-card credit-rules"><h4>How private contributions count</h4>
            <p><strong>Path activity</strong><span>1 credit · capped at 1/day</span></p>
            <p><strong>Learning node · optional</strong><span>1 credit · capped at 2/week</span></p>
            <p><strong>Reflection/conversation · optional</strong><span>1 credit · capped at 1/week</span></p>
            <p><strong>Comeback after 7+ inactive days</strong><span>1 private extra credit · once</span></p>
          </div>
          <div class="privacy-note">No participant ranking. No names or personal wellbeing answers are shared.</div>
        </div>`;
      }
      if (frame.id === "cohort-progress") {
        return `<div class="screen-wireframe">
          <div class="wire-kicker">Shared progress · This week</div><div class="wire-title">The cohort moves together.</div>
          <div class="wire-card"><h4>Weekly cohort progress</h4><div class="wire-meter"><span></span></div><div class="wire-milestone"><span>66%</span><span>Target 65%</span></div><p class="formula-note">72% × 50% + 58% × 30% + 64% × 20% = 66.2% → 66%</p></div>
          <div class="metric-grid">
            <div class="metric"><span class="metric-label">Breadth · 50%</span><strong class="metric-value">72%</strong></div>
            <div class="metric"><span class="metric-label">Consistency · 30%</span><strong class="metric-value">58%</strong></div>
            <div class="metric"><span class="metric-label">Learning · 20%</span><strong class="metric-value">64%</strong></div>
            <div class="metric"><span class="metric-label">Active days</span><strong class="metric-value">3+</strong></div>
          </div>
          <div class="state-variant state-milestone">
            <em>Alternate state</em>
            <strong>Weekly milestone reached</strong>
            <span>The cohort unlocks the next shared content item.</span>
          </div>
          <div class="state-variant state-final-target">
            <em>Alternate state</em>
            <strong>Final cohort target reached</strong>
            <span>The cohort receives one shared completion marker. No winner is named.</span>
          </div>
          <div class="wire-card milestone-history"><h4>Completed milestones</h4>
            <p><strong>Week 1</strong><span>First shared content unlocked</span></p>
            <p><strong>Week 2</strong><span>65% weekly target reached</span></p>
          </div>
          <div class="privacy-note">Aggregate progress only. Individual contribution data is not shown.</div>
        </div>`;
      }
      if (frame.id === "program-summary") return `<div class="screen-wireframe">
        <div class="wire-kicker">Program owner · Aggregate view</div><div class="wire-title">Program summary</div>
        <div class="metric-grid">
          <div class="metric"><span class="metric-label">Enrolled</span><strong class="metric-value">240</strong></div>
          <div class="metric"><span class="metric-label">Weekly participation</span><strong class="metric-value">72%</strong></div>
          <div class="metric"><span class="metric-label">Return after absence</span><strong class="metric-value">31%</strong></div>
          <div class="metric"><span class="metric-label">Active days</span><strong class="metric-value">3.4</strong></div>
        </div>
        <div class="wire-card topic-card"><h4>Learning completion by topic</h4>
          <div class="topic-row"><span>Daily rhythm</span><strong>68%</strong></div>
          <div class="topic-row"><span>Focus and reset</span><strong>61%</strong></div>
          <div class="topic-row"><span>Connection and work</span><strong>55%</strong></div>
          <div class="topic-row"><span>Learning/reflection</span><strong>59%</strong></div>
        </div>
        <div class="wire-card topic-card"><h4>Activity completion by category</h4>
          <div class="topic-row"><span>Daily rhythm</span><strong>74%</strong></div>
          <div class="topic-row"><span>Focus and reset</span><strong>66%</strong></div>
          <div class="topic-row"><span>Connection and work</span><strong>57%</strong></div>
          <div class="topic-row"><span>Learning/reflection</span><strong>52%</strong></div>
        </div>
        <div class="wire-card"><h4>Milestone history</h4><p>Week 1 · 60% reached</p><p>Week 2 · 65% reached</p><p>Week 3 · 70% in progress</p></div>
        <div class="privacy-note owner-note">No personal answers or individual wellbeing scores. No identifiable small-group breakdowns.</div>
      </div>`;
      return "";
    }

    function frameMarkup(frame) {
      const visual = frame.asset
        ? `<img class="screen-image" src="${frame.asset}" alt="${frame.title}">`
        : wireframe(frame);
      const statusLabel = frame.status === "unavailable" ? "Unavailable evidence" : frame.status;
      return `<article class="flow-frame status-${frame.status}" data-frame-id="${frame.id}">
        <div class="frame-topline"><div class="frame-badge">${statusLabel}</div><h3>${frame.title}</h3></div>
        ${visual}
        <dl class="annotation">
          <div class="annotation-row"><dt>Purpose · </dt><dd>${frame.purpose}</dd></div>
          <div class="annotation-row"><dt>Entry · </dt><dd>${frame.entry}</dd></div>
          <div class="annotation-row"><dt>Action · </dt><dd>${frame.action}</dd></div>
          <div class="annotation-row"><dt>Exit · </dt><dd>${frame.exit}</dd></div>
        </dl>
      </article>`;
    }

    const root = document.getElementById("flow-board");
    for (const [laneId, [title, description]] of Object.entries(laneNames)) {
      const frames = board.frames.filter((frame) => frame.lane === laneId);
      root.insertAdjacentHTML("beforeend", `<section class="lane" data-lane="${laneId}">
        <header class="lane-heading"><h2>${title}</h2><p>${description}</p></header>
        <div class="lane-frames">${frames.map(frameMarkup).join("")}</div>
      </section>`);
    }
    root.insertAdjacentHTML("beforeend", `<footer class="board-footer">
      <p><strong>Participant privacy:</strong> No participant ranking, names of other participants, personal wellbeing answers, or raw health scores.</p>
      <p><strong>Program privacy:</strong> No personal answers or individual wellbeing scores, individual histories, or identifiable small-group breakdowns.</p>
    </footer>`);

    function drawConnectors() {
      const svg = document.getElementById("connector-layer");
      const overlay = document.getElementById("connector-lines");
      svg.setAttribute("viewBox", `0 0 ${root.scrollWidth} ${root.scrollHeight}`);

      function boardBox(element) {
        let left = 0;
        let top = 0;
        let node = element;
        while (node && node !== root) {
          left += node.offsetLeft;
          top += node.offsetTop;
          node = node.offsetParent;
        }
        return {
          left,
          top,
          right: left + element.offsetWidth,
          bottom: top + element.offsetHeight,
          width: element.offsetWidth,
          height: element.offsetHeight,
        };
      }

      overlay.innerHTML = board.connectors.map((connector) => {
        const from = document.querySelector(`[data-frame-id="${connector.from}"]`);
        const to = document.querySelector(`[data-frame-id="${connector.to}"]`);
        if (!from || !to) return "";
        const a = boardBox(from);
        const b = boardBox(to);
        const sameLane = Math.abs(a.top - b.top) < 30;
        const reverse = sameLane && a.left > b.left;
        const skipsFrame = sameLane && b.left - a.right > a.width + 45;
        let d;
        if (reverse) {
          const startX = a.left + a.width / 2;
          const endX = b.left + b.width / 2;
          const routeY = Math.max(a.bottom, b.bottom) + 22;
          d = `M ${startX} ${a.bottom} L ${startX} ${routeY} L ${endX} ${routeY} L ${endX} ${b.bottom}`;
        } else if (sameLane && skipsFrame) {
          const startX = a.left + a.width / 2;
          const endX = b.left + b.width / 2;
          const channel = Number.isInteger(connector.channel) ? connector.channel : 0;
          const routeY = Math.min(a.top, b.top) - 20 - channel * 16;
          d = `M ${startX} ${a.top} L ${startX} ${routeY} L ${endX} ${routeY} L ${endX} ${b.top}`;
        } else if (sameLane) {
          const startX = a.right;
          const startY = a.top + a.height * .42;
          const endX = b.left;
          const endY = b.top + b.height * .42;
          const middleX = (startX + endX) / 2;
          d = `M ${startX} ${startY} L ${middleX} ${startY} L ${middleX} ${endY} L ${endX} ${endY}`;
        } else {
          const startX = a.left + a.width / 2;
          const endX = b.left + b.width / 2;
          const middleY = (a.bottom + b.top) / 2;
          d = `M ${startX} ${a.bottom} L ${startX} ${middleY} L ${endX} ${middleY} L ${endX} ${b.top}`;
        }
        const marker = connector.kind === "proposed" ? "arrow-proposed" : connector.kind === "revision" ? "arrow-revision" : connector.kind === "unavailable" ? "arrow-unavailable" : "arrow-current";
        const channelAttribute = Number.isInteger(connector.channel) ? ` data-route-channel="${connector.channel}"` : "";
        return `<path data-connector-kind="${connector.kind}"${channelAttribute} class="connector ${connector.kind}" d="${d}" marker-end="url(#${marker})"></path>`;
      }).join("");
    }
    requestAnimationFrame(drawConnectors);
    window.addEventListener("load", drawConnectors);
    window.addEventListener("resize", drawConnectors);
  </script>
</body>
</html>
